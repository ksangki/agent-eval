<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-label="한 요청의 트레이스에 실리는 품질·원가와 평가 자산이 벤더 밖으로 나가는 경로" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>한 요청의 트레이스에 실리는 품질·원가와 평가 자산이 벤더 밖으로 나가는 경로</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1D2742"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B07812"/></marker></defs><rect width="1000" height="580" fill="#F5F6F8"/><rect x="24" y="30" width="640" height="360" rx="14" fill="none" stroke="#B4BBC8" stroke-width="1.8" stroke-dasharray="7 6"/><text fill="#5F6880" font-size="14.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="40.0" y="50.0">평가·관측 도구 (벤더)</tspan></text><rect x="50.0" y="66.0" width="590.0" height="36.0" rx="6" fill="#3A4A72" stroke="none" stroke-width="0"/><text fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="64.0" y="84.0">요청 1건 — 트레이스</tspan></text><rect x="80.0" y="112.0" width="540.0" height="34.0" rx="6" fill="#E1E5EE" stroke="#3A4A72" stroke-width="1.5"/><text fill="#1D2742" font-size="14.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="94.0" y="129.0">에이전트 호출 스팬</tspan></text><rect x="120.0" y="156.0" width="220.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#3A4A72" stroke-width="1.5"/><text fill="#1D2742" font-size="13.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="130.0" y="172.0">도구 실행 스팬 (도구 이름)</tspan></text><rect x="370.0" y="156.0" width="230.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#3A4A72" stroke-width="1.5"/><text fill="#1D2742" font-size="13.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="380.0" y="172.0">도구 실행 스팬 (도구 이름)</tspa