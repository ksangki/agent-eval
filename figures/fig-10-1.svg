<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="운영 실패에서 평가셋으로, 다시 운영으로 도는 고리" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>운영 실패에서 평가셋으로, 다시 운영으로 도는 고리</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1D2742"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B07812"/></marker></defs><rect width="1000" height="600" fill="#F5F6F8"/><path d="M571.6,123.0 L653.7,161.7" fill="none" stroke="#B07812" stroke-width="3" marker-end="url(#mc)"/><path d="M731.3,257.7 L670.3,379.8" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><path d="M520.3,427.8 L419.7,427.8" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><path d="M269.7,379.8 L208.7,257.7" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><path d="M286.3,161.7 L368.4,123.0" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="350.0" y="33.0" width="240" height="84" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="470.0" y="71.1" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">운영 실패</text><text x="470.0" y="92.8" fill="#5F6880" font-size="13" font-weight="400" text-anchor="middle">재문의 · 받는 부서의 되물음</text><rect x="635.316954888546" y="167.74168609688525" width="240" height="84" rx="12" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="755.3" y="197.1" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">평가셋 편입</text><text x="755.3" y="218.8" fill="#5F6880" font-size="13" font-weight="400" text-anchor="middle">문항 주인(현업)이 고르고 정답을</text><text x="755.3" y="236.4" fill="#5F6880" font-size="13" font-weight="400" text-anchor="middle">쓴다</text><rect x="526.335575687742" y="385.75831390311475" width="240" height="84" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="646.3" y="423.9" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">회귀 평가</text><text x="646.3" y="445.6" fill="#5F6880" font-size="13" font-weight="400" text-anchor="middle">설정이 바뀔 때마다 돌린다</text><rect x="173.66442431225812" y="385.75831390311475" width="240" height="84" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="293.7" y="415.1" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">판본 기록</text><text x="293.7" y="436.8" fill="#5F6880" font-size="13" font-weight="400" text-anchor="middle">원장: 문항 수 · 기준 판본 · 궤적</text><text x="293.7" y="454.4" fill="#5F6880" font-size="13" font-weight="400" text-anchor="middle">열람</text><rect x="64.68304511145391" y="167.74168609688527" width="240" height="84" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="184.7" y="216.1" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">운영</text><rect x="173.66442431225812" y="528" width="240" height="62" rx="9" fill="#E1E5EE" stroke="#3A4A72" stroke-width="1.8"/><text x="293.7" y="554.7" fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle">기준 개정</text><text x="293.7" y="575.3" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">고친 날짜·이유를 적고 판본을 올린다</text><path d="M293.7,524 L293.7,475.8" fill="none" stroke="#1D2742" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mi)"/><rect x="760" y="528" width="210" height="62" rx="9" fill="#E1E5EE" stroke="#3A4A72" stroke-width="1.8"/><text x="865.0" y="554.7" fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle">능력 평가</text><text x="865.0" y="575.3" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">낮은 통과율에서 시작</text><path d="M800,524 L706.3,475.8" fill="none" stroke="#1D2742" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mi)"/><text fill="#5F6880" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="812.0" y="491.2">모두 통과하면 회귀 평가로</tspan><tspan x="812.0" y="508.8">넘어간다</tspan></text></svg>