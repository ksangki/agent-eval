<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-label="성적표 한 장 — 세 묶음, 행마다 붙는 열, 품질 실패가 가치 항목으로 들어가는 경로" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>성적표 한 장 — 세 묶음, 행마다 붙는 열, 품질 실패가 가치 항목으로 들어가는 경로</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1D2742"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B07812"/></marker></defs><rect width="1000" height="700" fill="#F5F6F8"/><rect x="30" y="40" width="340" height="208" rx="14" fill="#E1E5EE" stroke="#B4BBC8" stroke-width="1.8"/><text fill="#5F6880" font-size="14.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="46.0" y="60.0">품질 항목 — 잘하는가</tspan></text><rect x="46" y="74" width="308" height="34" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="200.0" y="96.8" fill="#1D2742" font-size="15.5" font-weight="700" text-anchor="middle">정확도</text><rect x="46" y="116" width="308" height="34" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="200.0" y="138.8" fill="#1D2742" font-size="15.5" font-weight="700" text-anchor="middle">일관성</text><rect x="46" y="158" width="308" height="34" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="200.0" y="180.8" fill="#1D2742" font-size="15.5" font-weight="700" text-anchor="middle">견고성</text><rect x="46" y="200" width="308" height="34" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="200.0" y="222.8" fill="#1D2742" font-size="15.5" font-weight="700" text-anchor="middle">안전</text><rect x="30" y="264" width="340" height="208" rx="14" fill="#FFFFFF" stroke="#3A4A72" stroke-width="1.8"/><text fill="#5F6880" font-size="14.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="46.0" y="284.0">가치 항목 — 값을 하는가</tspan></text><rect x="46" y="298" width="308" height="34" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="200.0" y="320.8" fill="#1D2742" font-size="15.5" font-weight="700" text-anchor="middle">성과 단위</text><rect x="46" y="340" width="308" height="34" rx="8" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="200.0" y="362.8" fill="#1D2742" font-size="15.5" font-weight="700" text-anchor="middle">순절감 시간</text><rect x="46" y="382" width="308" height="34" rx="8" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="200.0" y="404.8" fill="#1D2742" font-size="15.5" font-weight="700" text-anchor="middle">정답당 원가</text><rect x="46" y="424" width="308" height="34" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="200.0" y="446.8" fill="#1D2742" font-size="15.5" font-weight="700" text-anchor="middle">성과 지표</text><rect x="30" y="488" width="340" height="166" rx="14" fill="#E1E5EE" stroke="#B4BBC8" stroke-width="1.8"/><text fill="#5F6880" font-size="14.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="46.0" y="508.0">감독 항목 — 사람이 제대로 보는가</tspan></text><rect x="46" y="522" width="308" height="34" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="200.0" y="544.8" fill="#1D2742" font-size="15.5" font-weight="700" text-anchor="middle">승인률</text><rect x="46" y="564" width="308" height="34" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="200.0" y="586.8" fill="#1D2742" font-size="15.5" font-weight="700" text-anchor="middle">승인당 검토 시간</text><rect x="46" y="606" width="308" height="34" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="200.0" y="628.8" fill="#1D2742" font-size="15.5" font-weight="700" text-anchor="middle">무수정 승인률</text><rect x="430" y="262" width="190" height="76" rx="12" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="525.0" y="287.3" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">검토·재작업</text><text x="525.0" y="309.1" fill="#5F6880" font-size="13" font-weight="400" text-anchor="middle">틀린 결과물을 누군가 보고</text><text x="525.0" y="326.6" fill="#5F6880" font-size="13" font-weight="400" text-anchor="middle">다시 한다</text><path d="M374,144 L525,144 L525,258" fill="none" stroke="#B07812" stroke-width="3" marker-end="url(#mc)"/><text fill="#B07812" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="450.0" y="128.0">품질 실패</tspan></text><path d="M525,342 L525,357 L378,357" fill="none" stroke="#B07812" stroke-width="3" marker-end="url(#mc)"/><path d="M525,357 L525,399 L378,399" fill="none" stroke="#B07812" stroke-width="3" marker-end="url(#mc)"/><text fill="#B07812" font-size="14.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="560.0" y="390.2">시간·비용의</tspan><tspan x="560.0" y="409.8">숫자가 된다</tspan></text><text fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="820.0" y="52.0">행마다 붙는 열 10개</tspan></text><rect x="680" y="72" width="280" height="38" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="820.0" y="96.6" fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle">지표 정의</text><rect x="680" y="116" width="280" height="38" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="820.0" y="140.6" fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle">연구 설계</text><rect x="680" y="160" width="280" height="38" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="820.0" y="184.6" fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle">데이터 출처</text><rect x="680" y="204" width="280" height="38" rx="8" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="820.0" y="228.8" fill="#1D2742" font-size="15.5" font-weight="700" text-anchor="middle">측정 상태</text><rect x="680" y="248" width="280" height="38" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="820.0" y="272.6" fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle">현재 값</text><rect x="680" y="292" width="280" height="38" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="820.0" y="316.6" fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle">합격선</text><rect x="680" y="336" width="280" height="38" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="820.0" y="360.6" fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle">중단 기준</text><rect x="680" y="380" width="280" height="38" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="820.0" y="404.6" fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle">판정자</text><rect x="680" y="424" width="280" height="38" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="820.0" y="448.6" fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle">판정 주기</text><rect x="680" y="468" width="280" height="38" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="820.0" y="492.6" fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle">근거</text><rect x="680" y="520" width="280" height="86" rx="12" fill="#F3E5C6" stroke="#B4BBC8" stroke-width="1.8"/><text x="820.0" y="549.6" fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle">측정 상태 = 잼 · 일부 · 재지 못함</text><text x="820.0" y="570.7" fill="#5F6880" font-size="13" font-weight="400" text-anchor="middle">"일부"와 "재지 못함"에는 사유 한 줄. 재지</text><text x="820.0" y="588.3" fill="#5F6880" font-size="13" font-weight="400" text-anchor="middle">못한 행도 지우지 않는다</text><path d="M962,223 L980,223 L980,563 L962,563" fill="none" stroke="#B07812" stroke-width="2" stroke-dasharray="5 4"/><rect x="400.0" y="520.0" width="250.0" height="86.0" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.5" stroke-dasharray="6 5"/><text x="525.0" y="549.8" fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle">행이 없는 숫자</text><text x="525.0" y="570.9" fill="#5F6880" font-size="13" font-weight="400" text-anchor="middle">사용자 수·호출 수·토큰량 같은 사용</text><text x="525.0" y="588.4" fill="#5F6880" font-size="13" font-weight="400" text-anchor="middle">규모 → 표 아래 맥락 메모</text></svg>