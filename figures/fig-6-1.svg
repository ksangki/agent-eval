<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="한 업무의 원가가 생기는 곳 — 분자에 모이는 비용과 합격 건만 세는 분모" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>한 업무의 원가가 생기는 곳 — 분자에 모이는 비용과 합격 건만 세는 분모</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1D2742"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B07812"/></marker></defs><rect width="1000" height="520" fill="#F5F6F8"/><rect x="20" y="92" width="110" height="78" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="75.0" y="137.0" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">요청 1건</text><path d="M134,131.0 L156,131.0" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="160" y="92" width="150" height="78" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="235.0" y="118.6" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">모델 호출</text><text x="235.0" y="139.6" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">한 메시지에 여러 번</text><text x="235.0" y="156.4" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">호출</text><path d="M314,131.0 L336,131.0" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="340" y="92" width="140" height="78" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="410.0" y="127.1" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">도구 호출</text><text x="410.0" y="148.0" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">도구·기능 사용</text><path d="M484,131.0 L506,131.0" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="510" y="92" width="150" height="78" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="585.0" y="127.1" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">채점기 실행</text><text x="585.0" y="148.0" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">합격을 세려면 판정</text><path d="M664,131.0 L686,131.0" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="690" y="92" width="140" height="78" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="760.0" y="127.1" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">사람 검토</text><text x="760.0" y="148.0" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">검토·수정·재작성</text><path d="M410,88 C410,48 235,48 235,86" fill="none" stroke="#B07812" stroke-width="3" marker-end="url(#mc)"/><text fill="#B07812" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="322.0" y="42.0">재시도·재생성 — 실패한 시도도 비용</tspan></text><rect x="870" y="62" width="110" height="56" rx="12" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="925.0" y="96.0" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">합격</text><rect x="870" y="148" width="110" height="56" rx="12" fill="#E1E5EE" stroke="#B4BBC8" stroke-width="1.8"/><text x="925.0" y="182.0" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">불합격</text><path d="M834,121.0 L866,90" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><path d="M834,141.0 L866,176" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><line x1="235.0" y1="174" x2="235.0" y2="268" stroke="#B07812" stroke-width="1.6" stroke-dasharray="5 5"/><line x1="410.0" y1="174" x2="410.0" y2="268" stroke="#B07812" stroke-width="1.6" stroke-dasharray="5 5"/><line x1="585.0" y1="174" x2="585.0" y2="268" stroke="#B07812" stroke-width="1.6" stroke-dasharray="5 5"/><line x1="760.0" y1="174" x2="760.0" y2="268" stroke="#B07812" stroke-width="1.6" stroke-dasharray="5 5"/><rect x="160.0" y="270.0" width="670.0" height="74.0" rx="12" fill="#F3E5C6" stroke="#B07812" stroke-width="2"/><text x="495.0" y="297.8" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">분자 — 총비용</text><text x="495.0" y="320.1" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">호출·토큰, 도구·기능 사용, 재시도, 판정 비용(사람 시간 또는 모델 호출), 사람의 검토 시간 — 넣은</text><text x="495.0" y="338.4" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">범위를 원가 이름에 적는다</text><line x1="160" y1="372" x2="980" y2="372" stroke="#1D2742" stroke-width="2.4"/><rect x="600.0" y="392.0" width="380.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#B07812" stroke-width="2"/><text x="790.0" y="417.8" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">분모 — 합격 건수</text><text x="790.0" y="440.1" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">처리 건수가 아니다</text><path d="M985,118 C996,200 996,330 985,388" fill="none" stroke="#B07812" stroke-width="2.4" marker-end="url(#mc)"/><text fill="#1D2742" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="372.0">정답당 원가 =</tspan></text><text fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="160.0" y="476.9">불합격: 분모에서 빠지고 비용은 분자에 남는다. 처리 건당</tspan><tspan x="160.0" y="495.1">원가에서는 실패한 시도가 분모를 늘려 원가를 낮춰 보이게 한다</tspan></text></svg>