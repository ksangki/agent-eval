<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="채점 배분 — 코드·모델·사람 세 층과 보정 고리" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>채점 배분 — 코드·모델·사람 세 층과 보정 고리</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1D2742"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B07812"/></marker></defs><rect width="1000" height="470" fill="#F5F6F8"/><rect x="24" y="175" width="130" height="80" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="89.0" y="221.0" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">에이전트 출력</text><rect x="230" y="40" width="330" height="120" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="395.0" y="86.7" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">코드 채점 — 형식·구조</text><text x="395.0" y="108.9" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">요약의 네 요소가 다 있는가 · 글자 수 한도 ·</text><text x="395.0" y="127.1" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">금지된 항목</text><rect x="230" y="210" width="330" height="120" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="395.0" y="256.6" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">모델 채점 — 의미</text><text x="395.0" y="278.9" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">안내 내용이 상담 기록과 맞는가 · 후속 조치가</text><text x="395.0" y="297.2" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">빠졌는가</text><rect x="650" y="210" width="320" height="120" rx="12" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="810.0" y="265.8" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">사람 라벨 — 보정 기준·상한</text><text x="810.0" y="288.0" fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle">사람끼리의 일치도가 채점기가 닿을 수 있는 상한</text><path d="M158,200 L226,110" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><path d="M158,230 L226,260" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><path d="M564,245 L646,245" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><text fill="#5F6880" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="605.0" y="219.2">갈리거나 뒤집힌</tspan><tspan x="605.0" y="236.8">경계 사례</tspan></text><path d="M646,300 L564,300" fill="none" stroke="#B07812" stroke-width="3" marker-end="url(#mc)"/><text fill="#B07812" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="605.0" y="322.0">보정</tspan></text><text fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="395.0" y="182.0">"결정적인 것은 규칙 기반으로"</tspan></text><text fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="395.0" y="352.0">"의미적인 것은 모델 기반으로"</tspan></text><text fill="#1D2742" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="410.0">판정 대상마다 맞는 기구를 고르는 배분의 문제다. 결정적 결함을 모델에 맡기면 놓치고, 의미 판정을 정규식으로 하면 오탐이 는다</tspan></text><text fill="#B07812" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="450.0">사람 층이 없으면 모델 채점의 일치도를 잴 기준이 사라진다</tspan></text></svg>