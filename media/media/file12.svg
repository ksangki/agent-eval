<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="승인 피로 고리와 경보·재검토가 끼어드는 지점" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>승인 피로 고리와 경보·재검토가 끼어드는 지점</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1D2742"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B07812"/></marker></defs><rect width="1000" height="620" fill="#F5F6F8"/><path d="M616.0,138.0 L643.8,149.5" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><path d="M759.8,245.5 L759.8,364.5" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><path d="M643.8,460.5 L616.0,472.0" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><path d="M384.0,472.0 L356.2,460.5" fill="none" stroke="#B07812" stroke-width="3" marker-end="url(#mc)"/><path d="M240.2,364.5 L240.2,245.5" fill="none" stroke="#B07812" stroke-width="3" marker-end="url(#mc)"/><path d="M356.2,149.5 L384.0,138.0" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><rect x="375.0" y="48.0" width="250" height="84" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="500.0" y="96.0" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">① 승인 요청 수 증가</text><rect x="634.8076211353316" y="155.5" width="250" height="84" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="759.8" y="193.2" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">② 건당 주의 감소</text><text x="759.8" y="214.7" fill="#5F6880" font-size="13" font-weight="400" text-anchor="middle">승인당 검토 시간 하락</text><rect x="634.8076211353316" y="370.49999999999994" width="250" height="84" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="759.8" y="408.2" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">③ 승인률 상승</text><text x="759.8" y="429.7" fill="#5F6880" font-size="13" font-weight="400" text-anchor="middle">무수정 승인률도 오른다</text><rect x="375.0" y="478.0" width="250" height="84" rx="12" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="500.0" y="506.9" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">④ 감독 지표 경보</text><text x="500.0" y="528.4" fill="#5F6880" font-size="13" font-weight="400" text-anchor="middle">승인률 상승과 검토 시간 하락이 같은</text><text x="500.0" y="545.9" fill="#5F6880" font-size="13" font-weight="400" text-anchor="middle">기간에 함께</text><rect x="115.19237886466846" y="370.50000000000006" width="250" height="84" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="240.2" y="399.5" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">⑤ 표본 재검토</text><text x="240.2" y="420.9" fill="#5F6880" font-size="13" font-weight="400" text-anchor="middle">다른 검토자가 승인 건 일부를 다시</text><text x="240.2" y="438.5" fill="#5F6880" font-size="13" font-weight="400" text-anchor="middle">판정</text><rect x="115.1923788646684" y="155.49999999999997" width="250" height="84" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="240.2" y="184.4" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">⑥ 승인 범위 조정</text><text x="240.2" y="205.9" fill="#5F6880" font-size="13" font-weight="400" text-anchor="middle">재검토 결과를 보고 자동 승인 범위를</text><text x="240.2" y="223.4" fill="#5F6880" font-size="13" font-weight="400" text-anchor="middle">정한다</text><text fill="#5F6880" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="289.0">승인이 많아질수록</tspan></text><text fill="#5F6880" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="315.0">감독이 얇아지는 고리</tspan></text><text fill="#5F6880" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="810.0" y="296.2">근거: Anthropic</tspan><tspan x="810.0" y="313.8">텔레메트리 2026-05-25</tspan></text><text fill="#B07812" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="464.0">개입 지점 ▼</tspan></text><rect x="18" y="470" width="230" height="64" rx="9" fill="#F3E5C6" stroke="#B07812" stroke-width="1.8"/><text x="133.0" y="497.2" fill="#1D2742" font-size="14.5" font-weight="700" text-anchor="middle">결과값</text><text x="133.0" y="518.2" fill="#5F6880" font-size="13" font-weight="400" text-anchor="middle">오류가 있는데 무수정 승인된 비율</text><line x1="133" y1="454.50000000000006" x2="133" y2="470" stroke="#B07812" stroke-width="1.8" stroke-dasharray="5 5"/></svg>