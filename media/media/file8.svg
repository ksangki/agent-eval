<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="절감 추정에서 순절감까지 — 빼는 항과 데이터 출처 (예시, 가상 사례)" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>절감 추정에서 순절감까지 — 빼는 항과 데이터 출처 (예시, 가상 사례)</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1D2742"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B07812"/></marker></defs><rect width="1000" height="540" fill="#F5F6F8"/><line x1="70" y1="400" x2="980" y2="400" stroke="#1D2742" stroke-width="1.6"/><line x1="70" y1="400.0" x2="980" y2="400.0" stroke="#B4BBC8" stroke-width="1"/><text fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="end" dominant-baseline="middle"><tspan x="62.0" y="400.0">0</tspan></text><line x1="70" y1="325.0" x2="980" y2="325.0" stroke="#B4BBC8" stroke-width="1" stroke-dasharray="5 5"/><text fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="end" dominant-baseline="middle"><tspan x="62.0" y="325.0">500</tspan></text><line x1="70" y1="250.0" x2="980" y2="250.0" stroke="#B4BBC8" stroke-width="1" stroke-dasharray="5 5"/><text fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="end" dominant-baseline="middle"><tspan x="62.0" y="250.0">1,000</tspan></text><line x1="70" y1="175.0" x2="980" y2="175.0" stroke="#B4BBC8" stroke-width="1" stroke-dasharray="5 5"/><text fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="end" dominant-baseline="middle"><tspan x="62.0" y="175.0">1,500</tspan></text><line x1="70" y1="100.0" x2="980" y2="100.0" stroke="#B4BBC8" stroke-width="1" stroke-dasharray="5 5"/><text fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="end" dominant-baseline="middle"><tspan x="62.0" y="100.0">2,000</tspan></text><text fill="#5F6880" font-size="13.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="20.0" y="40.0">시간 (월)</tspan></text><rect x="100.0" y="100.0" width="120.0" height="300.0" rx="4" fill="#3A4A72" stroke="none" stroke-width="0"/><text fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="160.0" y="86.0">2,000시간</tspan></text><line x1="220" y1="100.0" x2="250" y2="100.0" stroke="#5F6880" stroke-width="1.2" stroke-dasharray="5 5"/><text fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="160.0" y="422.0">절감 추정</tspan></text><text fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="160.0" y="437.6">벤더 대시보드 (모델</tspan><tspan x="160.0" y="454.4">추정)</tspan></text><rect x="250.0" y="100.0" width="120.0" height="71.2" rx="4" fill="#F3E5C6" stroke="#B07812" stroke-width="1.8"/><text fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="310.0" y="86.0">−475</tspan></text><line x1="370" y1="171.25" x2="400" y2="171.25" stroke="#5F6880" stroke-width="1.2" stroke-dasharray="5 5"/><text fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="310.0" y="422.0">검토(읽기 구간)</tspan></text><text fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="310.0" y="446.0">화면 로그</tspan></text><rect x="400.0" y="171.2" width="120.0" height="78.8" rx="4" fill="#F3E5C6" stroke="#B07812" stroke-width="1.8"/><text fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="460.0" y="157.2">−525</tspan></text><line x1="520" y1="250.0" x2="550" y2="250.0" stroke="#5F6880" stroke-width="1.2" stroke-dasharray="5 5"/><text fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="460.0" y="422.0">재작업(편집 구간)</tspan></text><