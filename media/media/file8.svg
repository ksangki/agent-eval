e"><tspan x="910.0" y="446.0">가장 약한 항의 등급</tspan></text><text fill="#B07812" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="160.0" y="484.0">측정 상태: 일부</tspan></text><text fill="#B07812" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="760.0" y="484.0">측정 상태: 일부</tspan></text><text fill="#B07812" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="910.0" y="484.0">측정 상태: 일부</tspan></text><text fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="520.0">요약 60,000건 × 건당 2분 = 2,000시간에서 시작 · 빼는 항 넷은 서로 겹치지 않게 자르고, 절감을 주장하는 쪽이 아닌 사람이 채운다</tspan></text></svg>