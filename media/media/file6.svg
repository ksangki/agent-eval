<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="한 상담이 “해결”로 세어지기까지 — 벤더별 판정 지점과 창의 기준점" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>한 상담이 “해결”로 세어지기까지 — 벤더별 판정 지점과 창의 기준점</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1D2742"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B07812"/></marker></defs><rect width="1000" height="470" fill="#F5F6F8"/><text fill="#5F6880" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="30.0">가상 상담 한 건 (눈금 없는 개념도)</tspan></text><path d="M180,92 L975,92" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><circle cx="200" cy="92" r="8" fill="#3A4A72"/><text fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="200.0" y="68.0">첫 이메일</tspan></text><circle cx="360" cy="92" r="8" fill="#3A4A72"/><text fill="#1D2742" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="360.0" y="68.0">마지막 방문자 응답</tspan></text><circle cx="860" cy="92" r="8" fill="#B07812"/><text fill="#B07812" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="860.0" y="68.0">재문의</tspan></text><line x1="200" y1="102" x2="200" y2="410" stroke="#B4BBC8" stroke-width="1.4" stroke-dasharray="5 5"/><line x1="360" y1="102" x2="360" y2="410" stroke="#B4BBC8" stroke-width="1.4" stroke-dasharray="5 5"/><line x1="860" y1="102" x2="860" y2="410" stroke="#B07812" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="30" y="110" width="140" height="60" rx="9" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="100.0" y="136.1" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">Zendesk</text><text x="100.0" y="157.0" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">이메일 채널</text><rect x="30" y="210" width="140" height="60" rx="9" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="100.0" y="236.1" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">HubSpot</text><text x="100.0" y="257.0" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">고객 에이전트</text><rect x="30" y="310" width="140" height="60" rx="9" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="100.0" y="336.1" fill="#1D2742" font-size="16" font-weight="700" text-anchor="middle">Fin</text><text x="100.0" y="357.0" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">구 Intercom</text><rect x="200.0" y="124.0" width="330.0" height="32.0" rx="6" fill="#E1E5EE" stroke="#3A4A72" stroke-width="1.5"/><text fill="#1D2742" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="365.0" y="140.0">첫 이메일부터 72시간</tspan></text><circle cx="530" cy="140" r="8" fill="#3A4A72"/><text fill="#1D2742" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="544.0" y="140.0">판정 — LLM 검증</tspan></text><rect x="360.0" y="224.0" width="330.0" height="32.0" rx="6" fill="#E1E5EE" stroke="#3A4A72" stroke-width="1.5"/><text fill="#1D2742" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="525.0" y="240.0">마지막 방문자 응답부터 72시간</tspan></text><circle cx="690" cy="240" r="8" fill="#3A4A72"/><text fill="#1D2742" font-size="14" font-weight="700" text-anchor="end" dominant-baseline="middle"><tspan x="686.0" y="270.0">판정</tspan></text><rect x="760" y="210" width="220" height="60" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="870.0" y="235.9" fill="#1D2742" font-size="13.5" font-weight="700" text-anchor="middle">판정 뒤 사건은 상태를 바꾸지</text><text x="870.0" y="254.2" fill="#1D2742" font-size="13.5" font-weight="700" text-anchor="middle">않는다</text><text fill="#1D2742" font-size="14.5" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="200.0" y="340.0">고객이 확인하거나 추가 요청 없이 떠나면 해결</tspan></text><rect x="760" y="310" width="220" height="60" rx="8" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="870.0" y="335.9" fill="#1D2742" font-size="13.5" font-weight="700" text-anchor="middle">같은 대화로 돌아와 도움을</text><text x="870.0" y="354.2" fill="#1D2742" font-size="13.5" font-weight="700" text-anchor="middle">청하면 해결 차감</text><text fill="#B07812" font-size="14.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="440.0">같은 재문의가 한 벤더의 해결률은 깎고, 다른 벤더의 해결률에는 흔적을 남기지 않는다</tspan></text></svg>