<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-label="판정 시점과 규정·표준이 요구하는 지점" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>판정 시점과 규정·표준이 요구하는 지점</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1D2742"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B07812"/></marker></defs><rect width="1000" height="650" fill="#F5F6F8"/><line x1="280" y1="40" x2="280" y2="530" stroke="#B4BBC8" stroke-width="1.2" stroke-dasharray="5 5"/><line x1="480" y1="40" x2="480" y2="530" stroke="#B4BBC8" stroke-width="1.2" stroke-dasharray="5 5"/><line x1="570" y1="40" x2="570" y2="530" stroke="#B4BBC8" stroke-width="1.2" stroke-dasharray="5 5"/><line x1="905" y1="40" x2="905" y2="530" stroke="#B4BBC8" stroke-width="1.2" stroke-dasharray="5 5"/><text fill="#5F6880" font-size="14.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="40.0">EU AI Act — 고위험 AI</tspan></text><rect x="190" y="54" width="300" height="52" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="340.0" y="75.5" fill="#1D2742" font-size="13.5" font-weight="700" text-anchor="middle">제9조(8) 미리 정한 지표·임계값으로 시험</text><text x="340.0" y="95.1" fill="#5F6880" font-size="12" font-weight="400" text-anchor="middle">제공자 · 출시 전</text><rect x="570" y="114" width="405" height="52" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="772.5" y="135.5" fill="#1D2742" font-size="13.5" font-weight="700" text-anchor="middle">제72조 출시 후 모니터링</text><text x="772.5" y="155.1" fill="#5F6880" font-size="12" font-weight="400" text-anchor="middle">제공자 (배포자 데이터가 입력)</text><rect x="570" y="174" width="405" height="52" rx="8" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="772.5" y="195.5" fill="#1D2742" font-size="13.5" font-weight="700" text-anchor="middle">제26조 운영 모니터링·로그 보관</text><text x="772.5" y="215.1" fill="#5F6880" font-size="12" font-weight="400" text-anchor="middle">배포자 — 운영자에게 직접 걸리는 행</text><text fill="#5F6880" font-size="14.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="248.0">국내 — 고영향 AI 해당 시</tspan></text><rect x="190" y="262" width="300" height="52" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="340.0" y="283.5" fill="#1D2742" font-size="13.5" font-weight="700" text-anchor="middle">시행령 제28조①5 영향평가에 평가지표 기재</text><text x="340.0" y="303.1" fill="#5F6880" font-size="12" font-weight="400" text-anchor="middle">고영향 AI 사업자 · 노력 의무</text><rect x="480" y="322" width="495" height="52" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="727.5" y="343.5" fill="#1D2742" font-size="13.5" font-weight="700" text-anchor="middle">시행령 제27조② 조치 근거 문서 5년 보관</text><text x="727.5" y="363.1" fill="#5F6880" font-size="12" font-weight="400" text-anchor="middle">고영향 AI 사업자</text><text fill="#5F6880" font-size="14.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="396.0">NIST AI RMF 1.0 — 자발 적용</tspan></text><rect x="340" y="410" width="220" height="52" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="450.0" y="431.5" fill="#1D2742" font-size="13.5" font-weight="700" text-anchor="middle">MEASURE 2.3 배포 조건 시험</text><text x="450.0" y="451.1" fill="#5F6880" font-size="12" font-weight="400" text-anchor="middle">표준, 의무 아님</text><rect x="570" y="410" width="405" height="52" rx="8" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="772.5" y="431.5" fill="#1D2742" font-size="13.5" font-weight="700" text-anchor="middle">MEASURE 2.4 운영 중 모니터링</text><text x="772.5" y="451.1" fill="#5F6880" font-size="12" font-weight="400" text-anchor="middle">표준, 의무 아님</text><path d="M190,530 L975,530" fill="none" stroke="#1D2742" stroke-width="2" marker-end="url(#mi)"/><text fill="#1D2742" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="530.0">판정 시점</tspan></text><circle cx="620" cy="530" r="4" fill="#3A4A72"/><circle cx="680" cy="530" r="4" fill="#3A4A72"/><circle cx="740" cy="530" r="4" fill="#3A4A72"/><circle cx="800" cy="530" r="4" fill="#3A4A72"/><circle cx="280" cy="530" r="9" fill="#B07812"/><rect x="190" y="550" width="186" height="62" rx="9" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="283.0" y="576.3" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">합격선·중단 기준 선언</text><text x="283.0" y="596.6" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">도입 전 (파일럿 전)</text><circle cx="480" cy="530" r="9" fill="#B07812"/><rect x="400" y="550" width="166" height="62" rx="9" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="483.0" y="576.3" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">운영 진입 보류 판정</text><text x="483.0" y="596.6" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">파일럿 종료</text><circle cx="710" cy="530" r="9" fill="#B07812"/><rect x="630" y="550" width="160" height="62" rx="9" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="710.0" y="576.3" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">정기 판정</text><text x="710.0" y="596.6" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">운영 중 — 매월·트리거</text><circle cx="905" cy="530" r="9" fill="#B07812"/><rect x="815" y="550" width="160" height="62" rx="9" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="895.0" y="576.3" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">운영 중단 판정</text><text x="895.0" y="596.6" fill="#5F6880" font-size="12.5" font-weight="400" text-anchor="middle">갱신</text><text fill="#5F6880" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="634.0">EU 행 가운데 배포자 의무는 제26조 하나 — 나머지는 제공자 의무를 운영자의 판정 시점에 대 본 것이다 (법률 자문 아님)</tspan></text></svg>