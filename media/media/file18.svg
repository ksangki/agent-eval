<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="판정 일정표: 역할 × 시점" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>판정 일정표: 역할 × 시점</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1D2742"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B07812"/></marker></defs><rect width="1000" height="600" fill="#F5F6F8"/><rect x="160" y="30" width="196" height="64" rx="12" fill="#E1E5EE" stroke="#3A4A72" stroke-width="1.8"/><text x="258.0" y="68.4" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">현업</text><rect x="366" y="30" width="196" height="64" rx="12" fill="#E1E5EE" stroke="#3A4A72" stroke-width="1.8"/><text x="464.0" y="68.4" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">독립 판정자</text><rect x="572" y="30" width="196" height="64" rx="12" fill="#E1E5EE" stroke="#3A4A72" stroke-width="1.8"/><text x="670.0" y="58.1" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">만드는 쪽</text><text x="670.0" y="79.8" fill="#5F6880" font-size="13" font-weight="400" text-anchor="middle">근거를 만든다</text><rect x="778" y="30" width="196" height="64" rx="12" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="876.0" y="58.1" fill="#1D2742" font-size="17" font-weight="700" text-anchor="middle">운영 책임자</text><text x="876.0" y="79.8" fill="#5F6880" font-size="13" font-weight="400" text-anchor="middle">판정</text><rect x="24" y="120" width="122" height="104" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="85.0" y="178.2" fill="#1D2742" font-size="16.5" font-weight="700" text-anchor="middle">도입 전</text><rect x="160" y="120" width="196" height="104" rx="9" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="258.0" y="167.8" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">평가셋 첫 판 문항·정답</text><text x="258.0" y="186.7" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">예시, 성과 지표 정의</text><rect x="366" y="120" width="196" height="104" rx="9" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="464.0" y="177.3" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">채점기 보정 기록 검토·서명</text><rect x="572" y="120" width="196" height="104" rx="9" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="670.0" y="167.8" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">평가셋 판본 등록, 채점기</text><text x="670.0" y="186.7" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">구축</text><rect x="778" y="120" width="196" height="104" rx="9" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="876.0" y="167.8" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">합격선·중단 기준 선언,</text><text x="876.0" y="186.7" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">판정자 지정</text><rect x="24" y="234" width="122" height="104" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="85.0" y="292.2" fill="#1D2742" font-size="16.5" font-weight="700" text-anchor="middle">파일럿 종료</text><rect x="160" y="234" width="196" height="104" rx="9" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="258.0" y="291.2" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">성과 지표 값 확인</text><rect x="366" y="234" width="196" height="104" rx="9" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="464.0" y="291.2" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">표본 재판정, 품질 행 판정</text><rect x="572" y="234" width="196" height="104" rx="9" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="670.0" y="291.2" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">평가 실행, 측정 상태 기록</text><rect x="778" y="234" width="196" height="104" rx="9" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="876.0" y="291.2" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">운영 진입 보류 기준 판정</text><rect x="24" y="348" width="122" height="104" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="85.0" y="406.2" fill="#1D2742" font-size="16.5" font-weight="700" text-anchor="middle">운영 중</text><rect x="160" y="348" width="196" height="104" rx="9" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="258.0" y="405.2" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">운영 실패를 문항으로 제안</text><rect x="366" y="348" width="196" height="104" rx="9" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="464.0" y="395.8" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">정기 채점, 경보 시 표본</text><text x="464.0" y="414.7" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">재검토</text><rect x="572" y="348" width="196" height="104" rx="9" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="670.0" y="395.8" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">재평가 실행, 평가 자산</text><text x="670.0" y="414.7" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">반출</text><rect x="778" y="348" width="196" height="104" rx="9" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="876.0" y="405.2" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">정기 판정 결과 보고</text><rect x="24" y="462" width="122" height="104" rx="12" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="85.0" y="520.2" fill="#1D2742" font-size="16.5" font-weight="700" text-anchor="middle">갱신</text><rect x="160" y="462" width="196" height="104" rx="9" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="258.0" y="519.2" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">성과 지표 변화 해석</text><rect x="366" y="462" width="196" height="104" rx="9" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="464.0" y="519.2" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">갱신 전 판정</text><rect x="572" y="462" width="196" height="104" rx="9" fill="#FFFFFF" stroke="#B4BBC8" stroke-width="1.8"/><text x="670.0" y="519.2" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">회귀 평가 결과 제출</text><rect x="778" y="462" width="196" height="104" rx="9" fill="#F3E5C6" stroke="#B07812" stroke-width="2.5"/><text x="876.0" y="509.8" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">운영 중단 기준 판정, 연장</text><text x="876.0" y="528.7" fill="#1D2742" font-size="14" font-weight="700" text-anchor="middle">조건 제안</text><text fill="#5F6880" font-size="13.5" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="160.0" y="588.0">만드는 쪽의 산출물(평가셋 판본·보정 기록·회귀 평가 결과)이 운영 책임자 판정의 근거로 들어간다</tspan></text></svg>